[env]
TERM = "xterm-256color"

[font]
size = 18.0

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Regular Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Thin Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Thin"

#[font.bold]
#family = "BlexMono Nerd Font"
#style = "Regular"

#[font.bold_italic]
#family = "BlexMono Nerd Font"
#style = "Italic Regular"

#[font.italic]
#family = "BlexMono Nerd Font"
#style = "Light Italic"

#[font.normal]
#family = "BlexMono Nerd Font"
#style = "Light"

[selection]
save_to_clipboard = true

[window]
decorations = "full"
decorations_theme_variant = "Dark"
dynamic_title = true
option_as_alt = "Both"
title = "Alacritty"

[window.dimensions]
columns = 120
lines = 30

[window.padding]
x = 5
y = 2

[mouse]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
